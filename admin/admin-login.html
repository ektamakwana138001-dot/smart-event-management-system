<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Smart Events</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: auto;
            background: #0d6efd;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="text-center mb-4">
        <div class="logo">SE</div>

        <h3 class="mt-3">Admin Login</h3>

        <p class="text-muted">
            Smart Event Management System
        </p>
    </div>

    <form id="adminLoginForm">

        <div class="mb-3">
            <label class="form-label">Admin Email</label>

            <input
                type="email"
                id="email"
                class="form-control"
                placeholder="admin@smartevents.com"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>

            <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Enter password"
                required
            >
        </div>

        <button
            type="submit"
            class="btn btn-primary w-100"
        >
            Login
        </button>

    </form>

    <div class="alert alert-light border mt-3 text-center">
        <small>
            Demo Email: <b>admin@smartevents.com</b><br>
            Password: <b>admin123</b>
        </small>
    </div>

    <div class="text-center mt-3">
        <a href="../index.html">
            ← Back to Website
        </a>
    </div>

</div>

<script>

document.getElementById("adminLoginForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (
        email === "admin@smartevents.com" &&
        password === "admin123"
    ) {

        localStorage.setItem("adminLoggedIn", "true");

        window.location.href = "dashboard.html";

    } else {

        alert("Invalid Admin Email or Password!");

    }

});

</script>

</body>
</html>
