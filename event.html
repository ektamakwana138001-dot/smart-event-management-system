        content="Browse and discover upcoming events"

        rel="stylesheet"
    >

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>


<body>

        <a
            class="navbar-brand fw-bold"
            href="index.html"
        >
            SmartEvents
        </a>


        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavbar"
        >

            <span class="navbar-toggler-icon"></span>

        </button>


        <div
            class="collapse navbar-collapse"
            id="mainNavbar"
        >

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="index.html"
                    >
                        Home
                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link active"
                        href="events.html"
                    >
                        Events
                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="my-bookings.html"
                    >
                        My Bookings
                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="contact.html"
                    >
                        Contact
                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="login.html"
                    >
                        Login
                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="register.html"
                    >
                        Register
                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>



<!-- ================= PAGE HEADER ================= -->

<section class="py-5 bg-light">

    <div class="container text-center">

        <h1 class="fw-bold">
            Explore Events
        </h1>

        <p class="text-muted">
            Discover upcoming events and book your tickets.
        </p>

    </div>

</section>



<!-- ================= SEARCH & FILTER ================= -->

<section class="py-4">

    <div class="container">

        <div class="row g-3">

            <div class="col-md-8">

                <input
                    type="text"
                    id="eventSearch"
                    class="form-control"
                    placeholder="Search events..."
                >

            </div>


            <div class="col-md-4">

                <select
                    id="categoryFilter"
                    class="form-select"
                >

                    <option value="all">
                        All Categories
                    </option>

                    <option value="technology">
                        Technology
                    </option>

                    <option value="music">
                        Music
                    </option>

                    <option value="business">
                        Business
                    </option>

                    <option value="food">
                        Food
                    </option>

                    <option value="art">
                        Art
                    </option>

                </select>

            </div>

        </div>

    </div>

</section>



<!-- ================= EVENTS ================= -->

<section class="pb-5">

    <div class="container">

        <!-- JavaScript events will appear here -->

        <div
            id="eventsContainer"
            class="row g-4"
        >

            <!-- Event cards generated by events.js -->

        </div>

    </div>

</section>



<!-- ================= FOOTER ================= -->

<footer class="bg-dark text-white py-4">

    <div class="container">

        <div class="row">

            <div class="col-md-6">

                <h5>
                    SmartEvents
                </h5>

                <p class="text-light">
                    Smart Event Management &
                    Ticket Booking System.
                </p>

            </div>


            <div class="col-md-6 text-md-end">

                <p class="mb-1">
                    Quick Links
                </p>

                <a
                    href="index.html"
                    class="text-white me-3"
                >
                    Home
                </a>

                <a
                    href="contact.html"
                    class="text-white"
                >
                    Contact
                </a>

            </div>

        </div>


        <hr>


        <p class="text-center mb-0">

            ©
            <span class="current-year"></span>
            SmartEvents.
            All Rights Reserved.

        </p>

    </div>

</footer>



<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Main JS -->

<script src="js/script.js"></script>


<!-- Events JS -->

<script src="js/events.js"></script>


</body>

</html>
