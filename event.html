<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Events | Smart Events</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">

    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">

            <i class="bi bi-calendar-event"></i>

            Smart Events

        </a>


        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavbar">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div
            class="collapse navbar-collapse"
            id="mainNavbar">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="event.html">
                        Events
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="my-bookings.html">
                        <i class="bi bi-ticket-perforated"></i>
                        My Bookings
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="profile.html">
                        <i class="bi bi-person-circle"></i>
                        Profile
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link login-link" href="login.html">
                        Login
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link register-link" href="register.html">
                        Register
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link logout-link" href="#">
                        Logout
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- HEADER -->

<section class="py-5 bg-light">

    <div class="container text-center">

        <span class="text-primary fw-semibold">
            DISCOVER EVENTS
        </span>

        <h1 class="fw-bold mt-2">
            Upcoming Events
        </h1>

        <p class="text-muted">
            Find your next exciting experience.
        </p>

    </div>

</section>


<!-- SEARCH -->

<section class="py-4">

    <div class="container">

        <div class="row g-3">

            <div class="col-md-8">

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-search"></i>

                    </span>

                    <input
                        type="text"
                        id="eventSearch"
                        class="form-control"
                        placeholder="Search events, category or location...">

                </div>

            </div>


            <div class="col-md-4">

                <select
                    id="categoryFilter"
                    class="form-select">

                    <option value="">
                        All Categories
                    </option>

                    <option value="Technology">
                        Technology
                    </option>

                    <option value="Music">
                        Music
                    </option>

                    <option value="Business">
                        Business
                    </option>

                    <option value="College">
                        College
                    </option>

                    <option value="Startup">
                        Startup
                    </option>

                    <option value="Sports">
                        Sports
                    </option>

                </select>

            </div>

        </div>

    </div>

</section>


<!-- EVENTS -->

<section class="pb-5">

    <div class="container">

        <div
            id="eventsContainer"
            class="row">

            <!-- JavaScript will load all 11 events here -->

        </div>

    </div>

</section>


<!-- FOOTER -->

<footer class="bg-dark text-white py-4">

    <div class="container text-center">

        <h5 class="fw-bold">

            <i class="bi bi-calendar-event"></i>

            Smart Events

        </h5>

        <p class="text-white-50 mb-1">

            Smart Event Management & Ticket Booking System

        </p>

        <small class="text-white-50">

            © 2026 Smart Events

        </small>

    </div>

</footer>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="script.js"></script>

</body>

</html>
