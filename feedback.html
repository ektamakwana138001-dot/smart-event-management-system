<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Feedback</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="feedback-container">
    <h2>Event Feedback Form</h2>
    <p>We value your experience! Please share your thoughts with us.</p>
    
    <form id="feedbackForm">
      <!-- Full Name -->
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" required placeholder="Enter your name">
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="Enter your email">
      </div>

      <!-- Event Name -->
      <div class="form-group">
        <label for="eventSelect">Select Event</label>
        <select id="eventSelect" required>
          <option value="">-- Choose an Event --</option>
          <option value="tech">Tech Conference</option>
          <option value="music">Music Festival</option>
          <option value="business">Business Expo</option>
        </select>
      </div>

      <!-- Rating -->
      <div class="form-group">
        <label>Overall Rating</label>
        <select id="rating" required>
          <option value="5">⭐⭐⭐⭐⭐ (Excellent)</option>
          <option value="4">⭐⭐⭐⭐ (Good)</option>
          <option value="3">⭐⭐⭐ (Average)</option>
          <option value="2">⭐⭐ (Poor)</option>
          <option value="1">⭐ (Very Bad)</option>
        </select>
      </div>

      <!-- Feedback Comments -->
      <div class="form-group">
        <label for="comments">Your Feedback / Suggestions</label>
        <textarea id="comments" rows="4" placeholder="Write your feedback here..." required></textarea>
      </div>

      <button type="submit" class="btn-submit">Submit Feedback</button>
    </form>
    
    <div id="successMessage" style="display:none;" class="success-msg">
      Thank you for your feedback!
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
