<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Events - Smart Events</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        /* SIDEBAR */

        .sidebar {
            width: 250px;
            min-height: 100vh;
            background: #212529;
            position: fixed;
            left: 0;
            top: 0;
            padding: 20px 15px;
            z-index: 1000;
        }

        .brand {
            color: white;
            font-size: 22px;
            font-weight: bold;
            padding: 10px;
            margin-bottom: 25px;
        }

        .sidebar a {
            display: block;
            color: #ddd;
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 5px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #0d6efd;
            color: white;
        }

        .logout-btn {
            margin-top: 25px;
            color: #ffb3b3 !important;
        }

        /* MAIN */

        .main-content {
            margin-left: 250px;
            padding: 30px;
        }

        .topbar {
            background: white;
            padding: 18px 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .page-title {
            font-size: 30px;
            font-weight: bold;
        }

        /* CARDS */

        .stat-card {
            background: white;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
        }

        /* EVENT CARD */

        .event-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 18px rgba(0,0,0,0.07);
            height: 100%;
        }

        .event-image {
            width: 100%;
            height: 190px;
            object-fit: cover;
        }

        .event-body {
            padding: 20px;
        }

        .event-title {
            font-size: 21px;
            font-weight: bold;
        }

        .event-price {
            color: #198754;
            font-size: 21px;
            font-weight: bold;
        }

        .coming-badge {
            background: #fff3cd;
            color: #664d03;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        /* MODAL */

        .modal-content {
            border-radius: 15px;
        }

        .form-control,
        .form-select {
            border-radius: 8px;
            padding: 11px;
        }

        /* MOBILE */

        @media (max-width: 768px) {

            .sidebar {
                width: 100%;
                min-height: auto;
                position: relative;
            }

            .main-content {
                margin-left: 0;
                padding: 15px;
            }

        }

    </style>

</head>


<body>


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="brand">

            <i class="bi bi-calendar-event"></i>

            Smart Events

        </div>


        <a href="dashboard.html">

            <i class="bi bi-speedometer2"></i>

            Dashboard

        </a>


        <a
            href="admin-events.html"
            class="active">

            <i class="bi bi-calendar3"></i>

            Manage Events

        </a>


        <a href="my-bookings.html">

            <i class="bi bi-ticket-perforated"></i>

            Bookings

        </a>


        <a href="contact.html">

            <i class="bi bi-chat-left-text"></i>

            Feedback

        </a>


        <a href="index.html">

            <i class="bi bi-globe"></i>

            View Website

        </a>


        <a
            href="#"
            class="logout-btn"
            onclick="logoutAdmin()">

            <i class="bi bi-box-arrow-left"></i>

            Logout

        </a>

    </aside>


    <!-- MAIN -->

    <main class="main-content">


        <!-- TOP BAR -->

        <div class="topbar d-flex justify-content-between align-items-center flex-wrap gap-3">

            <div>

                <div class="page-title">

                    Manage Events

                </div>

                <small class="text-muted">

                    Add, edit and manage your events

                </small>

            </div>


            <button
                class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#eventModal"
                onclick="openAddModal()">

                <i class="bi bi-plus-lg"></i>

                Add Event

            </button>

        </div>


        <!-- STATISTICS -->

        <div class="row g-3 mb-4">


            <div class="col-md-4">

                <div class="stat-card">

                    <div class="text-muted">

                        Total Events

                    </div>

                    <div
                        id="totalEvents"
                        class="stat-number text-primary">

                        0

                    </div>

                </div>

            </div>


            <div class="col-md-4">

                <div class="stat-card">

                    <div class="text-muted">

                        Coming Soon

                    </div>

                    <div
                        id="comingEvents"
                        class="stat-number text-warning">

                        0

                    </div>

                </div>

            </div>


            <div class="col-md-4">

                <div class="stat-card">

                    <div class="text-muted">

                        Categories

                    </div>

                    <div
                        id="categoryCount"
                        class="stat-number text-success">

                        0

                    </div>

                </div>

            </div>


        </div>


        <!-- EVENTS -->

        <div id="eventsContainer" class="row g-4">

        </div>


    </main>


    <!-- ADD / EDIT MODAL -->

    <div
        class="modal fade"
        id="eventModal"
        tabindex="-1">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">


                <div class="modal-header">

                    <h5
                        id="modalTitle"
                        class="modal-title">

                        Add Event

                    </h5>


                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">

                    </button>

                </div>


                <div class="modal-body">


                    <form id="eventForm">


                        <input
                            type="hidden"
                            id="editIndex"
                            value="-1">


                        <!-- EVENT NAME -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">

                                Event Name

                            </label>

                            <input
                                type="text"
                                id="eventName"
                                class="form-control"
                                placeholder="Enter event name"
                                required>

                        </div>


                        <div class="row">


                            <!-- CATEGORY -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-bold">

                                    Category

                                </label>


                                <select
                                    id="eventCategory"
                                    class="form-select"
                                    required>

                                    <option value="">

                                        Select Category

                                    </option>

                                    <option>

                                        Technology

                                    </option>

                                    <option>

                                        Entertainment

                                    </option>

                                    <option>

                                        Business

                                    </option>

                                    <option>

                                        Education

                                    </option>

                                    <option>

                                        Food

                                    </option>

                                    <option>

                                        Sports

                                    </option>

                                </select>

                            </div>


                            <!-- PRICE -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-bold">

                                    Ticket Price (₹)

                                </label>


                                <input
                                    type="number"
                                    id="eventPrice"
                                    class="form-control"
                                    min="0"
                                    placeholder="Enter ticket price"
                                    required>

                            </div>


                        </div>


                        <!-- LOCATION -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">

                                Location

                            </label>


                            <input
                                type="text"
                                id="eventLocation"
                                class="form-control"
                                placeholder="Enter event location"
                                required>

                        </div>


                        <!-- IMAGE -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">

                                Online Image URL

                            </label>


                            <input
                                type="url"
                                id="eventImage"
                                class="form-control"
                                placeholder="https://example.com/image.jpg"
                                required>


                            <small class="text-muted">

                                Use an online image URL.
                                No local image is required.

                            </small>

                        </div>


                        <!-- DESCRIPTION -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">

                                Description

                            </label>


                            <textarea
                                id="eventDescription"
                                class="form-control"
                                rows="4"
                                placeholder="Enter event description"
                                required></textarea>

                        </div>


                        <!-- STATUS -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">

                                Status

                            </label>


                            <select
                                id="eventStatus"
                                class="form-select">

                                <option value="Coming Soon">

                                    Coming Soon

                                </option>

                                <option value="Available">

                                    Available

                                </option>

                            </select>

                        </div>


                    </form>

                </div>


                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Cancel

                    </button>


                    <button
                        type="button"
                        class="btn btn-primary"
                        onclick="saveEvent()">

                        <i class="bi bi-check-lg"></i>

                        Save Event

                    </button>

                </div>


            </div>

        </div>

    </div>


    <!-- BOOTSTRAP JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <script>

        /* DEFAULT EVENTS */

        const defaultEvents = [

            {
                name: "Music Festival",
                category: "Entertainment",
                price: 499,
                location: "Ahmedabad",
                image: "https://images.unsplash.com/photo-1501386761578-eac5c94b800a?auto=format&fit=crop&w=1000&q=85",
                description: "Enjoy live music, amazing performances and unforgettable entertainment.",
                status: "Coming Soon"
            },

            {
                name: "Technology Conference",
                category: "Technology",
                price: 799,
                location: "Ahmedabad",
                image: "https://images.unsplash.com/photo-1540575467063-178a50c2df87?auto=format&fit=crop&w=1000&q=85",
                description: "Explore innovation, artificial intelligence and future technology.",
                status: "Coming Soon"
            },

            {
                name: "Business Summit",
                category: "Business",
                price: 999,
                location: "Ahmedabad",
                image: "https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=1000&q=85",
                description: "Connect with entrepreneurs and industry leaders.",
                status: "Coming Soon"
            },

            {
                name: "Startup Meetup",
                category: "Business",
                price: 599,
                location: "Rajkot",
                image: "https://images.unsplash.com/photo-1551836022-d5d88e9218df?auto=format&fit=crop&w=1000&q=85",
                description: "Meet startup founders, entrepreneurs and investors.",
                status: "Coming Soon"
            },

            {
                name: "Coding Workshop",
                category: "Technology",
                price: 399,
                location: "Rajkot",
                image: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1000&q=85",
                description: "Improve your programming skills with practical sessions.",
                status: "Coming Soon"
            },

            {
                name: "Food Festival",
                category: "Food",
                price: 299,
                location: "Ahmedabad",
                image: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=1000&q=85",
                description: "Taste delicious food from different cuisines.",
                status: "Coming Soon"
            }

        ];


        /* GET EVENTS */

        let events =
            JSON.parse(
                localStorage.getItem(
                    "adminEvents"
                )
            );


        /* FIRST TIME */

        if (!events || events.length === 0) {

            events = defaultEvents;

            localStorage.setItem(
                "adminEvents",
                JSON.stringify(events)
            );

        }


        /* DISPLAY EVENTS */

        function displayEvents() {

            const container =
                document.getElementById(
                    "eventsContainer"
                );


            container.innerHTML = "";


            events.forEach(
                function(event, index) {


                    container.innerHTML += `

                        <div class="col-md-6 col-xl-4">

                            <div class="event-card">

                                <img
                                    src="${event.image}"
                                    class="event-image"
                                    alt="${event.name}">


                                <div class="event-body">

                                    <div class="d-flex
                                        justify-content-between
                                        align-items-center
                                        mb-2">

                                        <span
                                            class="badge bg-primary">

                                            ${event.category}

                                        </span>


                                        <span
                                            class="coming-badge">

                                            ${event.status}

                                        </span>

                                    </div>


                                    <div class="event-title">

                                        ${event.name}

                                    </div>


                                    <p class="text-muted mt-2">

                                        ${event.description}

                                    </p>


                                    <p class="mb-1">

                                        <i
                                            class="bi bi-geo-alt text-primary">
                                        </i>

                                        ${event.location}

                                    </p>


                                    <div class="event-price mb-3">

                                        ₹${event.price}

                                    </div>


                                    <div class="d-flex gap-2">

                                        <button
                                            class="btn btn-outline-primary flex-fill"
                                            onclick="editEvent(${index})">

                                            <i class="bi bi-pencil"></i>

                                            Edit

                                        </button>


                                        <button
                                            class="btn btn-outline-danger flex-fill"
                                            onclick="deleteEvent(${index})">

                                            <i class="bi bi-trash"></i>

                                            Delete

                                        </button>

                                    </div>

                                </div>

                            </div>

                        </div>

                    `;

                }
            );


            updateStats();

        }


        /* STATISTICS */

        function updateStats() {

            document.getElementById(
                "totalEvents"
            ).textContent =
                events.length;


            const coming =
                events.filter(
                    function(event) {

                        return event.status ===
                            "Coming Soon";

                    }
                ).length;


            document.getElementById(
                "comingEvents"
            ).textContent =
                coming;


            const categories =
                new Set(
                    events.map(
                        function(event) {

                            return event.category;

                        }
                    )
                );


            document.getElementById(
                "categoryCount"
            ).textContent =
                categories.size;

        }


        /* ADD MODAL */

        function openAddModal() {

            document.getElementById(
                "modalTitle"
            ).textContent =
                "Add Event";


            document.getElementById(
                "editIndex"
            ).value =
                "-1";


            document.getElementById(
                "eventForm"
            ).reset();

        }


        /* EDIT EVENT */

        function editEvent(index) {

            const event =
                events[index];


            document.getElementById(
                "modalTitle"
            ).textContent =
                "Edit Event";


            document.getElementById(
                "editIndex"
            ).value =
                index;


            document.getElementById(
                "eventName"
            ).value =
                event.name;


            document.getElementById(
                "eventCategory"
            ).value =
                event.category;


            document.getElementById(
                "eventPrice"
            ).value =
                event.price;


            document.getElementById(
                "eventLocation"
            ).value =
                event.location;


            document.getElementById(
                "eventImage"
            ).value =
                event.image;


            document.getElementById(
                "eventDescription"
            ).value =
                event.description;


            document.getElementById(
                "eventStatus"
            ).value =
                event.status;


            const modal =
                new bootstrap.Modal(
                    document.getElementById(
                        "eventModal"
                    )
                );


            modal.show();

        }


        /* SAVE EVENT */

        function saveEvent() {


            const name =
                document.getElementById(
                    "eventName"
                ).value.trim();


            const category =
                document.getElementById(
                    "eventCategory"
                ).value;


            const price =
                document.getElementById(
                    "eventPrice"
                ).value;


            const location =
                document.getElementById(
                    "eventLocation"
                ).value.trim();


            const image =
                document.getElementById(
                    "eventImage"
                ).value.trim();


            const description =
                document.getElementById(
                    "eventDescription"
                ).value.trim();


            const status =
                document.getElementById(
                    "eventStatus"
                ).value;


            const editIndex =
                Number(
                    document.getElementById(
                        "editIndex"
                    ).value
                );


            /* VALIDATION */

            if (
                !name ||
                !category ||
                !price ||
                !location ||
                !image ||
                !description
            ) {

                alert(
                    "Please fill all event details."
                );

                return;

            }


            if (Number(price) < 0) {

                alert(
                    "Price cannot be negative."
                );

                return;

            }


            const eventData = {

                name:
                    name,

                category:
                    category,

                price:
                    Number(price),

                location:
                    location,

                image:
                    image,

                description:
                    description,

                status:
                    status

            };


            /* ADD */

            if (editIndex === -1) {

                events.push(
                    eventData
                );

                alert(
                    "Event added successfully."
                );

            }

            /* EDIT */

            else {

                events[editIndex] =
                    eventData;

                alert(
                    "Event updated successfully."
                );

            }


            /* SAVE */

            localStorage.setItem(
                "adminEvents",
                JSON.stringify(events)
            );


            displayEvents();


            /* CLOSE MODAL */

            const modalElement =
                document.getElementById(
                    "eventModal"
                );


            const modal =
                bootstrap.Modal.getInstance(
                    modalElement
                );


            if (modal) {

                modal.hide();

            }

        }


        /* DELETE EVENT */

        function deleteEvent(index) {


            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this event?"
                );


            if (!confirmDelete) {

                return;

            }


            events.splice(
                index,
                1
            );


            localStorage.setItem(
                "adminEvents",
                JSON.stringify(events)
            );


            displayEvents();


            alert(
                "Event deleted successfully."
            );

        }


        /* LOGOUT */

        function logoutAdmin() {

            const confirmLogout =
                confirm(
                    "Are you sure you want to logout?"
                );


            if (!confirmLogout) {

                return;

            }


            localStorage.removeItem(
                "adminLoggedIn"
            );


            localStorage.removeItem(
                "adminData"
            );


            window.location.href =
                "admin-login.html";

        }


        /* PAGE LOAD */

        displayEvents();

    </script>

</body>

</html>
