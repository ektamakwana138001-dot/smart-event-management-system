<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | Smart Events</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">

    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            <i class="bi bi-calendar-event"></i>
            Smart Events
        </a>

        <div>
            <a href="index.html" class="btn btn-outline-light me-2">
                Home
            </a>

            <a href="#" class="btn btn-light logout-link">
                Logout
            </a>
        </div>

    </div>

</nav>


<section class="py-5 bg-light">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-7">

                <div class="card border-0 shadow-sm">

                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">

                            <div
                                class="rounded-circle bg-primary text-white d-inline-flex align-items-center justify-content-center"
                                style="width:90px;height:90px;">

                                <i class="bi bi-person-fill fs-1"></i>

                            </div>

                            <h2 class="fw-bold mt-3">
                                My Profile
                            </h2>

                            <p class="text-muted">
                                Your Smart Events account
                            </p>

                        </div>


                        <div id="profileMessage"></div>


                        <div class="row g-3">

                            <div class="col-md-6">

                                <div class="bg-light rounded p-3">

                                    <small class="text-muted">
                                        Full Name
                                    </small>

                                    <h5
                                        id="profileName"
                                        class="fw-bold mb-0 mt-1">

                                        Loading...

                                    </h5>

                                </div>

                            </div>


                            <div class="col-md-6">

                                <div class="bg-light rounded p-3">

                                    <small class="text-muted">
                                        Email Address
                                    </small>

                                    <h5
                                        id="profileEmail"
                                        class="fw-bold mb-0 mt-1">

                                        Loading...

                                    </h5>

                                </div>

                            </div>


                            <div class="col-md-6">

                                <div class="bg-light rounded p-3">

                                    <small class="text-muted">
                                        Account Status
                                    </small>

                                    <h5 class="fw-bold mb-0 mt-1 text-success">

                                        <i class="bi bi-check-circle"></i>
                                        Active

                                    </h5>

                                </div>

                            </div>


                            <div class="col-md-6">

                                <div class="bg-light rounded p-3">

                                    <small class="text-muted">
                                        Total Bookings
                                    </small>

                                    <h5
                                        id="totalBookings"
                                        class="fw-bold mb-0 mt-1">

                                        0

                                    </h5>

                                </div>

                            </div>

                        </div>


                        <hr class="my-4">


                        <div class="d-grid gap-2">

                            <a
                                href="my-bookings.html"
                                class="btn btn-primary">

                                <i class="bi bi-ticket-perforated"></i>

                                My Bookings

                            </a>


                            <a
                                href="event.html"
                                class="btn btn-outline-primary">

                                <i class="bi bi-calendar-event"></i>

                                Explore Events

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>


<footer class="bg-dark text-white py-4">

    <div class="container text-center">

        <h5 class="fw-bold">

            <i class="bi bi-calendar-event"></i>

            Smart Events

        </h5>

        <p class="text-white-50 mb-1">

            Smart Event Management & Ticket Booking System

        </p>

        <small class="text-white-50">

            © 2026 Smart Events

        </small>

    </div>

</footer>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="script.js"></script>


<script>

document.addEventListener("DOMContentLoaded", function () {

    const user =
        JSON.parse(
            localStorage.getItem("smartEventCurrentUser")
        );

    const nameElement =
        document.getElementById("profileName");

    const emailElement =
        document.getElementById("profileEmail");

    const bookingsElement =
        document.getElementById("totalBookings");

    if (!user) {

        window.location.href = "login.html";

        return;

    }

    nameElement.textContent =
        user.name || "User";

    emailElement.textContent =
        user.email || "";

    const bookings =
        JSON.parse(
            localStorage.getItem("smartEventBookings")
        ) || [];

    const userBookings =
        bookings.filter(
            booking =>
                booking.userId === user.id
        );

    bookingsElement.textContent =
        userBookings.length;

});

</script>

</body>

</html>
