<!-- ================= PAGE HEADER ================= -->

<section class="py-5 bg-light">

    <div class="container text-center">

        <h1 class="fw-bold">
            Book Your Tickets
        </h1>

        <p class="text-muted">
            Fill in your details to confirm your booking.
        </p>

    </div>

</section>



<!-- ================= BOOKING FORM ================= -->

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card shadow border-0">

                    <div class="card-body p-4 p-md-5">


                        <form id="bookingForm">


                            <!-- Event -->

                            <div class="mb-4">

                                <label
                                    for="bookingEvent"
                                    class="form-label fw-semibold"
                                >
                                    Select Event
                                </label>

                                <select
                                    id="bookingEvent"
                                    class="form-select"
                                    required
                                >

                                    <option value="">
                                        Select an event
                                    </option>

                                    <option value="Tech Innovation Summit 2026">
                                        Tech Innovation Summit 2026
                                    </option>

                                    <option value="Music & Cultural Festival">
                                        Music & Cultural Festival
                                    </option>

                                    <option value="Business Networking Meet">
                                        Business Networking Meet
                                    </option>

                                    <option value="Food & Street Festival">
                                        Food & Street Festival
                                    </option>

                                    <option value="Startup & Entrepreneur Expo">
                                        Startup & Entrepreneur Expo
                                    </option>

                                    <option value="Art & Photography Exhibition">
                                        Art & Photography Exhibition
                                    </option>

                                </select>

                            </div>



                            <!-- Name -->

                            <div class="mb-3">

                                <label
                                    for="bookingName"
                                    class="form-label fw-semibold"
                                >
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    id="bookingName"
                                    class="form-control"
                                    placeholder="Enter your full name"
                                    required
                                >

                            </div>



                            <!-- Email -->

                            <div class="mb-3">

                                <label
                                    for="bookingEmail"
                                    class="form-label fw-semibold"
                                >
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    id="bookingEmail"
                                    class="form-control"
                                    placeholder="Enter your email"
                                    required
                                >

                            </div>



                            <!-- Phone -->

                            <div class="mb-3">

                                <label
                                    for="bookingPhone"
                                    class="form-label fw-semibold"
                                >
                                    Phone Number
                                </label>

                                <input
                                    type="tel"
                                    id="bookingPhone"
                                    class="form-control"
                                    placeholder="Enter 10-digit phone number"
                                    maxlength="10"
                                    required
                                >

                            </div>



                            <!-- Ticket Price -->

                            <div class="mb-3">

                                <label
                                    for="ticketPrice"
                                    class="form-label fw-semibold"
                                >
                                    Ticket Price
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        ₹
                                    </span>

                                    <input
                                        type="number"
                                        id="ticketPrice"
                                        class="form-control"
                                        value="499"
                                        readonly
                                    >

                                </div>

                            </div>



                            <!-- Ticket Quantity -->

                            <div class="mb-3">

                                <label
                                    for="ticketQuantity"
                                    class="form-label fw-semibold"
                                >
                                    Number of Tickets
                                </label>

                                <input
                                    type="number"
                                    id="ticketQuantity"
                                    class="form-control"
                                    value="1"
                                    min="1"
                                    max="10"
                                    required
                                >

                            </div>



                            <!-- Total -->

                            <div class="alert alert-primary d-flex justify-content-between align-items-center">

                                <strong>
                                    Total Amount
                                </strong>

                                <strong
                                    id="totalAmount"
                                    class="fs-4"
                                >
                                    ₹499.00
                                </strong>

                            </div>



                            <!-- Submit -->

                            <button
                                type="submit"
                                class="btn btn-primary w-100 btn-lg"
                            >
                                Confirm Booking
                            </button>


                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>
