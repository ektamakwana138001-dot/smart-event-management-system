<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Bookings | Smart Events</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <style>

        .bookings-header {
            padding: 60px 0;
            color: white;

            background:
                linear-gradient(
                    135deg,
                    #07182e,
                    #0d6efd
                );
        }

        .bookings-header h1 {
            font-weight: 800;
            font-size: 42px;
        }

        .bookings-section {
            background: #f8f9fa;
            min-height: 650px;
            padding: 55px 0;
        }

        .booking-card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 25px;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.07);
        }

        .event-icon {
            width: 60px;
            height: 60px;

            border-radius: 14px;

            background: #eaf2ff;
            color: #0d6efd;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 28px;
        }

        .booking-card h4 {
            font-weight: 800;
        }

        .booking-info {
            color: #666;
            font-size: 14px;
        }

        .booking-info i {
            color: #0d6efd;
        }

        .status-badge {
            background: #d1e7dd;
            color: #0f5132;

            padding: 7px 13px;
            border-radius: 50px;

            font-size: 12px;
            font-weight: 700;
        }

        .price-summary {
            background: #f1f6ff;
            border-radius: 14px;
            padding: 20px;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
        }

        .total-row {
            border-top: 2px solid #ddd;
            margin-top: 8px;
            padding-top: 12px;

            font-size: 20px;
            font-weight: 800;
        }

        .empty-bookings {
            background: white;
            border-radius: 18px;
            padding: 70px 25px;
            text-align: center;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.07);
        }

        .empty-bookings i {
            font-size: 60px;
            color: #0d6efd;
        }

        .empty-bookings h3 {
            margin-top: 20px;
            font-weight: 800;
        }

        .booking-id {
            font-size: 12px;
            color: #888;
        }

        @media (max-width: 767px) {

            .bookings-header h1 {
                font-size: 32px;
            }

            .bookings-section {
                padding: 35px 15px;
            }

        }

    </style>

</head>

<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="index.html">

            <i class="bi bi-calendar-event"></i>

            Smart Events

        </a>


        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div
            class="collapse navbar-collapse"
            id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="index.html">

                        Home

                    </a>

                </li>

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="events.html">

                        Events

                    </a>

                </li>

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="booking.html">

                        Book Ticket

                    </a>

                </li>

                <li class="nav-item">

                    <a
                        class="nav-link active"
                        href="my-bookings.html">

                        My Bookings

                    </a>

                </li>

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="dashboard.html">

                        Profile

                    </a>

                </li>

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="contact.html">

                        Contact

                    </a>

                </li>

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="login.html">

                        Login

                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- =====================================================
     HEADER
===================================================== -->

<section class="bookings-header">

    <div class="container text-center">

        <span
            class="badge bg-warning text-dark p-2 mb-3">

            <i class="bi bi-ticket-perforated"></i>

            Booking History

        </span>

        <h1>
            My Bookings
        </h1>

        <p class="mb-0">
            View all your event bookings and payment details.
        </p>

    </div>

</section>


<!-- =====================================================
     BOOKINGS
===================================================== -->

<section class="bookings-section">

    <div class="container">


        <!-- SUMMARY -->

        <div
            class="row g-3 mb-4"
            id="bookingSummary">


            <div class="col-md-4">

                <div class="bg-white p-4 rounded-4 shadow-sm">

                    <small class="text-muted">
                        Total Bookings
                    </small>

                    <h3
                        id="summaryBookings"
                        class="fw-bold mb-0">

                        0

                    </h3>

                </div>

            </div>


            <div class="col-md-4">

                <div class="bg-white p-4 rounded-4 shadow-sm">

                    <small class="text-muted">
                        Total Tickets
                    </small>

                    <h3
                        id="summaryTickets"
                        class="fw-bold mb-0">

                        0

                    </h3>

                </div>

            </div>


            <div class="col-md-4">

                <div class="bg-white p-4 rounded-4 shadow-sm">

                    <small class="text-muted">
                        Total Amount
                    </small>

                    <h3
                        id="summaryAmount"
                        class="fw-bold mb-0">

                        ₹0

                    </h3>

                </div>

            </div>

        </div>


        <!-- BOOKING LIST -->

        <div id="bookingList">

            <!-- JavaScript will load bookings -->

        </div>

    </div>

</section>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

    <div class="container text-center">

        <p class="mb-0">

            © 2026 Smart Event Management System.
            All Rights Reserved.

        </p>

    </div>

</footer>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="js/my-bookings.js"></script>

</body>

</html>
