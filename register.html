

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | Smart Events</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <style>

        .register-section {

            min-height: 85vh;

            display: flex;

            align-items: center;

            padding: 50px 15px;

            background:
                linear-gradient(
                    135deg,
                    #eef5ff,
                    #f8f9fa
                );

        }

        .register-card {

            max-width: 520px;

            width: 100%;

            margin: auto;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 12px 35px
                rgba(0,0,0,0.10);

        }

        .register-icon {

            width: 75px;

            height: 75px;

            margin: auto;

            border-radius: 50%;

            background: #eaf2ff;

            color: #0d6efd;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 35px;

        }

        .register-card h2 {

            font-weight: 800;

        }

        .form-label {

            font-weight: 600;

        }

        .error-message {

            color: #dc3545;

            font-size: 13px;

            margin-top: 5px;

        }

        .success-message {

            display: none;

            padding: 15px;

            border-radius: 10px;

            margin-bottom: 20px;

        }

    </style>

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="index.html">

            <i class="bi bi-calendar-event"></i>

            Smart Events

        </a>


        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div
            class="collapse navbar-collapse"
            id="navbarNav">

            <ul class="navbar-nav ms-auto">


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="index.html">

                        Home

                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="events.html">

                        Events

                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="booking.html">

                        Book Ticket

                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="my-bookings.html">

                        My Bookings

                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link active"
                        href="register.html">

                        Register

                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="login.html">

                        Login

                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- =====================================================
     REGISTER SECTION
===================================================== -->

<section class="register-section">

    <div class="register-card">


        <!-- TITLE -->

        <div class="text-center mb-4">

            <div class="register-icon mb-3">

                <i class="bi bi-person-plus"></i>

            </div>


            <h2>

                Create Account

            </h2>


            <p class="text-muted">

                Register to book and manage your events.

            </p>

        </div>


        <!-- SUCCESS MESSAGE -->

        <div
            id="successMessage"
            class="success-message alert alert-success">

        </div>


        <!-- REGISTER FORM -->

        <form
            id="registerForm"
            novalidate>


            <!-- FULL NAME -->

            <div class="mb-3">

                <label
                    for="name"
                    class="form-label">

                    Full Name

                </label>


                <input
                    type="text"
                    id="name"
                    class="form-control"
                    placeholder="Enter your full name"
                    required>


                <div
                    id="nameError"
                    class="error-message">

                </div>

            </div>


            <!-- EMAIL -->

            <div class="mb-3">

                <label
                    for="email"
                    class="form-label">

                    Email Address

                </label>


                <input
                    type="email"
                    id="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required>


                <div
                    id="emailError"
                    class="error-message">

                </div>

            </div>


            <!-- PHONE -->

            <div class="mb-3">

                <label
                    for="phone"
                    class="form-label">

                    Mobile Number

                </label>


                <input
                    type="tel"
                    id="phone"
                    class="form-control"
                    placeholder="Enter 10 digit mobile number"
                    maxlength="10"
                    required>


                <div
                    id="phoneError"
                    class="error-message">

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="mb-3">

                <label
                    for="password"
                    class="form-label">

                    Password

                </label>


                <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="Create password"
                    required>


                <div
                    id="passwordError"
                    class="error-message">

                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="mb-4">

                <label
                    for="confirmPassword"
                    class="form-label">

                    Confirm Password

                </label>


                <input
                    type="password"
                    id="confirmPassword"
                    class="form-control"
                    placeholder="Confirm your password"
                    required>


                <div
                    id="confirmPasswordError"
                    class="error-message">

                </div>

            </div>


            <!-- TERMS -->

            <div class="form-check mb-4">

                <input
                    class="form-check-input"
                    type="checkbox"
                    id="terms"
                    required>


                <label
                    class="form-check-label"
                    for="terms">

                    I agree to the Terms &
                    Conditions.

                </label>

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="btn btn-primary btn-lg w-100">

                <i class="bi bi-person-check"></i>

                Create Account

            </button>


        </form>


        <!-- LOGIN LINK -->

        <div class="text-center mt-4">

            <p class="mb-0">

                Already have an account?

                <a
                    href="login.html"
                    class="fw-bold">

                    Login

                </a>

            </p>

        </div>


    </div>

</section>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

    <div class="container text-center">

        <p class="mb-0">

            © 2026 Smart Event Management System.
            All Rights Reserved.

        </p>

    </div>

</footer>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>

const registerForm =
    document.getElementById(
        "registerForm"
    );


const successMessage =
    document.getElementById(
        "successMessage"
    );


// =====================================================
// FORM SUBMIT
// =====================================================

registerForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        // Clear errors

        document.getElementById(
            "nameError"
        ).textContent = "";


        document.getElementById(
            "emailError"
        ).textContent = "";


        document.getElementById(
            "phoneError"
        ).textContent = "";


        document.getElementById(
            "passwordError"
        ).textContent = "";


        document.getElementById(
            "confirmPasswordError"
        ).textContent = "";


        successMessage.style.display =
            "none";


        let valid = true;


        // =================================================
        // GET VALUES
        // =================================================

        const name =
            document.getElementById(
                "name"
            ).value.trim();


        const email =
            document.getElementById(
                "email"
            ).value.trim();


        const phone =
            document.getElementById(
                "phone"
            ).value.trim();


        const password =
            document.getElementById(
                "password"
            ).value;


        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            ).value;


        const terms =
            document.getElementById(
                "terms"
            ).checked;


        // =================================================
        // NAME VALIDATION
        // =================================================

        if (name === "") {

            document.getElementById(
                "nameError"
            ).textContent =
                "Please enter your name.";

            valid = false;

        }
        else if (name.length < 3) {

            document.getElementById(
                "nameError"
            ).textContent =
                "Name must contain at least 3 characters.";

            valid = false;

        }


        // =================================================
        // EMAIL VALIDATION
        // =================================================

        const emailPattern =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


        if (email === "") {

            document.getElementById(
                "emailError"
            ).textContent =
                "Please enter your email.";

            valid = false;

        }
        else if (
            !emailPattern.test(email)
        ) {

            document.getElementById(
                "emailError"
            ).textContent =
                "Please enter a valid email.";

            valid = false;

        }


        // =================================================
        // PHONE VALIDATION
        // =================================================

        const phonePattern =
            /^[6-9][0-9]{9}$/;


        if (phone === "") {

            document.getElementById(
                "phoneError"
            ).textContent =
                "Please enter your mobile number.";

            valid = false;

        }
        else if (
            !phonePattern.test(phone)
        ) {

            document.getElementById(
                "phoneError"
            ).textContent =
                "Please enter a valid 10 digit mobile number.";

            valid = false;

        }


        // =================================================
        // PASSWORD VALIDATION
        // =================================================

        if (password === "") {

            document.getElementById(
                "passwordError"
            ).textContent =
                "Please create a password.";

            valid = false;

        }
        else if (password.length < 6) {

            document.getElementById(
                "passwordError"
            ).textContent =
                "Password must contain at least 6 characters.";

            valid = false;

        }


        // =================================================
        // CONFIRM PASSWORD
        // =================================================

        if (
            confirmPassword === ""
        ) {

            document.getElementById(
                "confirmPasswordError"
            ).textContent =
                "Please confirm your password.";

            valid = false;

        }
        else if (
            password !== confirmPassword
        ) {

            document.getElementById(
                "confirmPasswordError"
            ).textContent =
                "Passwords do not match.";

            valid = false;

        }


        // =================================================
        // TERMS
        // =================================================

        if (!terms) {

            alert(
                "Please agree to the Terms & Conditions."
            );

            valid = false;

        }


        // Stop if invalid

        if (!valid) {

            return;

        }


        // =================================================
        // GET EXISTING USERS
        // =================================================

        let users =
            JSON.parse(
                localStorage.getItem(
                    "users"
                ) || "[]"
            );


        // =================================================
        // CHECK EXISTING EMAIL
        // =================================================

        const existingUser =
            users.find(
                function(user) {

                    return user.email === email;

                }
            );


        if (existingUser) {

            document.getElementById(
                "emailError"
            ).textContent =
                "This email is already registered.";

            return;

        }


        // =================================================
        // CREATE USER
        // =================================================

        const newUser = {

            id:
                Date.now(),

            name:
                name,

            email:
                email,

            phone:
                phone,

            password:
                password,

            role:
                "user"

        };


        // =================================================
        // SAVE USER
        // =================================================

        users.push(
            newUser
        );


        localStorage.setItem(
            "users",
            JSON.stringify(
                users
            )
        );


        // =================================================
        // SUCCESS
        // =================================================

        successMessage.innerHTML = `

            <i class="bi bi-check-circle-fill"></i>

            Account created successfully!

            <br>

            Redirecting to login...

        `;


        successMessage.style.display =
            "block";


        // =================================================
        // RESET
        // =================================================

        registerForm.reset();


        // =================================================
        // REDIRECT
        // =================================================

        setTimeout(
            function() {

                window.location.href =
                    "login.html";

            },
            1500
        );

    }
);

</script>


</body>

</html>
