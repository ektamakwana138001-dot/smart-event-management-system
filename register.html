<!-- ================= REGISTER SECTION ================= -->

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-5 col-md-7">

                <div class="card border-0 shadow-lg">

                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">

                            <h2 class="fw-bold">
                                Create Account
                            </h2>

                            <p class="text-muted">
                                Register to book exciting events
                            </p>

                        </div>


                        <!-- REGISTER MESSAGE -->

                        <div
                            id="registerMessage"
                            class="alert"
                            style="display:none;">
                        </div>


                        <!-- REGISTER FORM -->

                        <form id="registerForm">

                            <!-- NAME -->

                            <div class="mb-3">

                                <label
                                    for="registerName"
                                    class="form-label fw-semibold">

                                    Full Name

                                </label>

                                <input
                                    type="text"
                                    id="registerName"
                                    class="form-control"
                                    placeholder="Enter your full name"
                                    required>

                            </div>


                            <!-- EMAIL -->

                            <div class="mb-3">

                                <label
                                    for="registerEmail"
                                    class="form-label fw-semibold">

                                    Email Address

                                </label>

                                <input
                                    type="email"
                                    id="registerEmail"
                                    class="form-control"
                                    placeholder="Enter your email"
                                    required>

                            </div>


                            <!-- PASSWORD -->

                            <div class="mb-3">

                                <label
                                    for="registerPassword"
                                    class="form-label fw-semibold">

                                    Password

                                </label>

                                <input
                                    type="password"
                                    id="registerPassword"
                                    class="form-control"
                                    placeholder="Minimum 6 characters"
                                    minlength="6"
                                    required>

                            </div>


                            <!-- CONFIRM PASSWORD -->

                            <div class="mb-4">

                                <label
                                    for="confirmPassword"
                                    class="form-label fw-semibold">

                                    Confirm Password

                                </label>

                                <input
                                    type="password"
                                    id="confirmPassword"
                                    class="form-control"
                                    placeholder="Confirm your password"
                                    minlength="6"
                                    required>

                            </div>


                            <!-- REGISTER BUTTON -->

                            <button
                                type="submit"
                                class="btn btn-primary w-100 py-2 fw-semibold">

                                Create Account

                            </button>

                        </form>


                        <!-- LOGIN LINK -->

                        <div class="text-center mt-4">

                            <p class="mb-0 text-muted">

                                Already have an account?

                                <a
                                    href="login.html"
                                    class="text-primary fw-semibold text-decoration-none">

                                    Login

                                </a>

                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>
