<!-- ================= REGISTER SECTION ================= -->

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-7 col-lg-6">

                <div class="card shadow border-0">

                    <div class="card-body p-4 p-md-5">


                        <!-- Heading -->

                        <div class="text-center mb-4">

                            <h2 class="fw-bold">
                                Create Account
                            </h2>

                            <p class="text-muted">
                                Register to book and manage your events.
                            </p>

                        </div>


                        <!-- Register Form -->

                        <form id="registerForm">


                            <!-- Full Name -->

                            <div class="mb-3">

                                <label
                                    for="name"
                                    class="form-label"
                                >
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    id="name"
                                    class="form-control"
                                    placeholder="Enter your full name"
                                    required
                                >

                            </div>


                            <!-- Email -->

                            <div class="mb-3">

                                <label
                                    for="email"
                                    class="form-label"
                                >
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    placeholder="Enter your email"
                                    required
                                >

                            </div>


                            <!-- Phone -->

                            <div class="mb-3">

                                <label
                                    for="phone"
                                    class="form-label"
                                >
                                    Phone Number
                                </label>

                                <input
                                    type="tel"
                                    id="phone"
                                    class="form-control"
                                    placeholder="Enter 10-digit phone number"
                                    maxlength="10"
                                    required
                                >

                            </div>


                            <!-- Password -->

                            <div class="mb-3">

                                <label
                                    for="password"
                                    class="form-label"
                                >
                                    Password
                                </label>

                                <input
                                    type="password"
                                    id="password"
                                    class="form-control"
                                    placeholder="Minimum 6 characters"
                                    minlength="6"
                                    required
                                >

                            </div>


                            <!-- Confirm Password -->

                            <div class="mb-4">

                                <label
                                    for="confirmPassword"
                                    class="form-label"
                                >
                                    Confirm Password
                                </label>

                                <input
                                    type="password"
                                    id="confirmPassword"
                                    class="form-control"
                                    placeholder="Re-enter your password"
                                    required
                                >

                            </div>


                            <!-- Terms -->

                            <div class="form-check mb-4">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="terms"
                                    required
                                >

                                <label
                                    class="form-check-label"
                                    for="terms"
                                >
                                    I agree to the terms and conditions.
                                </label>

                            </div>


                            <!-- Register Button -->

                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                            >
                                Create Account
                            </button>


                        </form>


                        <!-- Login Link -->

                        <div class="text-center mt-4">

                            <p class="mb-0">

                                Already have an account?

                                <a
                                    href="login.html"
                                    class="text-primary fw-semibold"
                                >
                                    Login
                                </a>

                            </p>

                        </div>


                    </div>

                </div>

            </div>

</section>
