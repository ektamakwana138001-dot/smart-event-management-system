
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - Smart Events</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    rgba(13, 110, 253, 0.75),
                    rgba(8, 66, 152, 0.75)
                ),
                url("https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=1800&q=85");

            background-size: cover;
            background-position: center;

            display: flex;
            flex-direction: column;
        }

        /* NAVBAR */

        .navbar {
            background: #0d6efd !important;
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 21px;
        }

        /* REGISTER AREA */

        .register-area {
            flex: 1;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 50px 15px;
        }

        .register-card {
            width: 100%;
            max-width: 520px;

            background: white;

            border-radius: 20px;

            padding: 35px;

            box-shadow:
                0 15px 50px
                rgba(0,0,0,0.25);
        }

        .register-icon {
            width: 75px;
            height: 75px;

            margin: 0 auto 20px;

            background: #e7f1ff;
            color: #0d6efd;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 35px;
        }

        .register-card h2 {
            text-align: center;
            font-weight: bold;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-control {
            padding: 12px;
            border-radius: 10px;
        }

        .input-group-text {
            background: #f8f9fa;
        }

        .register-btn {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            font-weight: bold;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            text-decoration: none;
            font-weight: bold;
        }

        /* PASSWORD STRENGTH */

        .password-strength {
            height: 5px;
            border-radius: 5px;
            background: #e9ecef;
            margin-top: 8px;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            transition: 0.3s;
        }

        .strength-text {
            font-size: 13px;
            margin-top: 5px;
        }

        /* ERROR */

        .error-message {
            color: #dc3545;
            font-size: 13px;
            margin-top: 5px;
        }

        /* FOOTER */

        footer {
            background: #212529;
            color: white;
            text-align: center;
            padding: 18px;
        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a
                class="navbar-brand"
                href="index.html">

                <i class="bi bi-calendar-event"></i>

                Smart Events

            </a>


            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div
                class="collapse navbar-collapse"
                id="navbarMenu">

                <ul class="navbar-nav ms-auto">


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="index.html">

                            Home

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="events.html">

                            Events

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="login.html">

                            Login

                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- REGISTER -->

    <section class="register-area">

        <div class="register-card">


            <div class="register-icon">

                <i class="bi bi-person-plus"></i>

            </div>


            <h2>

                Create Account

            </h2>


            <p class="subtitle">

                Register to book amazing events

            </p>


            <!-- REGISTER FORM -->

            <form
                id="registerForm"
                novalidate>


                <!-- NAME -->

                <div class="mb-3">

                    <label
                        for="name"
                        class="form-label">

                        Full Name

                    </label>


                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-person"></i>

                        </span>


                        <input
                            type="text"
                            id="name"
                            class="form-control"
                            placeholder="Enter your full name">

                    </div>


                    <div
                        id="nameError"
                        class="error-message">
                    </div>

                </div>


                <!-- EMAIL -->

                <div class="mb-3">

                    <label
                        for="email"
                        class="form-label">

                        Email Address

                    </label>


                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-envelope"></i>

                        </span>


                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            placeholder="Enter your email">

                    </div>


                    <div
                        id="emailError"
                        class="error-message">
                    </div>

                </div>


                <!-- PHONE -->

                <div class="mb-3">

                    <label
                        for="phone"
                        class="form-label">

                        Mobile Number

                    </label>


                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-phone"></i>

                        </span>


                        <input
                            type="tel"
                            id="phone"
                            class="form-control"
                            placeholder="Enter 10 digit mobile number"
                            maxlength="10">

                    </div>


                    <div
                        id="phoneError"
                        class="error-message">
                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="mb-3">

                    <label
                        for="password"
                        class="form-label">

                        Password

                    </label>


                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-lock"></i>

                        </span>


                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder="Create a password">


                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            onclick="togglePassword(
                                'password',
                                'passwordIcon'
                            )">

                            <i
                                id="passwordIcon"
                                class="bi bi-eye">
                            </i>

                        </button>

                    </div>


                    <div
                        class="password-strength">

                        <div
                            id="strengthBar"
                            class="strength-bar">
                        </div>

                    </div>


                    <div
                        id="strengthText"
                        class="strength-text">
                    </div>


                    <div
                        id="passwordError"
                        class="error-message">
                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="mb-3">

                    <label
                        for="confirmPassword"
                        class="form-label">

                        Confirm Password

                    </label>


                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-shield-lock"></i>

                        </span>


                        <input
                            type="password"
                            id="confirmPassword"
                            class="form-control"
                            placeholder="Confirm your password">


                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            onclick="togglePassword(
                                'confirmPassword',
                                'confirmIcon'
                            )">

                            <i
                                id="confirmIcon"
                                class="bi bi-eye">
                            </i>

                        </button>

                    </div>


                    <div
                        id="confirmPasswordError"
                        class="error-message">
                    </div>

                </div>


                <!-- TERMS -->

                <div class="form-check mb-4">

                    <input
                        type="checkbox"
                        class="form-check-input"
                        id="terms">


                    <label
                        class="form-check-label"
                        for="terms">

                        I agree to the Terms &
                        Conditions.

                    </label>


                    <div
                        id="termsError"
                        class="error-message">
                    </div>

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="btn btn-primary register-btn">

                    <i class="bi bi-person-plus"></i>

                    Create Account

                </button>


            </form>


            <!-- LOGIN -->

            <div class="login-link">

                Already have an account?

                <a href="login.html">

                    Login Now

                </a>

            </div>


        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        © 2026 Smart Event Management System.
        All Rights Reserved.

    </footer>


    <!-- BOOTSTRAP JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- REGISTER JAVASCRIPT -->

    <script>


        /* PASSWORD SHOW/HIDE */

        function togglePassword(
            fieldId,
            iconId
        ) {

            const field =
                document.getElementById(
                    fieldId
                );

            const icon =
                document.getElementById(
                    iconId
                );


            if (
                field.type === "password"
            ) {

                field.type = "text";

                icon.className =
                    "bi bi-eye-slash";

            } else {

                field.type = "password";

                icon.className =
                    "bi bi-eye";

            }

        }


        /* PASSWORD STRENGTH */

        document.getElementById(
            "password"
        ).addEventListener(
            "input",
            function() {


                const password =
                    this.value;


                const bar =
                    document.getElementById(
                        "strengthBar"
                    );


                const text =
                    document.getElementById(
                        "strengthText"
                    );


                if (!password) {

                    bar.style.width = "0%";

                    text.textContent = "";

                    return;

                }


                let strength = 0;


                if (
                    password.length >= 6
                ) {

                    strength++;

                }


                if (
                    /[A-Z]/.test(password)
                ) {

                    strength++;

                }


                if (
                    /[0-9]/.test(password)
                ) {

                    strength++;

                }


                if (
                    /[^A-Za-z0-9]/.test(password)
                ) {

                    strength++;

                }


                if (strength <= 1) {

                    bar.style.width = "25%";

                    bar.style.background =
                        "#dc3545";

                    text.textContent =
                        "Weak password";

                    text.style.color =
                        "#dc3545";

                }

                else if (strength === 2) {

                    bar.style.width = "50%";

                    bar.style.background =
                        "#ffc107";

                    text.textContent =
                        "Medium password";

                    text.style.color =
                        "#856404";

                }

                else if (strength === 3) {

                    bar.style.width = "75%";

                    bar.style.background =
                        "#0dcaf0";

                    text.textContent =
                        "Good password";

                    text.style.color =
                        "#0dcaf0";

                }

                else {

                    bar.style.width = "100%";

                    bar.style.background =
                        "#198754";

                    text.textContent =
                        "Strong password";

                    text.style.color =
                        "#198754";

                }

            }
        );


        /* REGISTER FORM */

        document.getElementById(
            "registerForm"
        ).addEventListener(
            "submit",
            function(event) {


                event.preventDefault();


                /* CLEAR ERRORS */

                document.getElementById(
                    "nameError"
                ).textContent = "";


                document.getElementById(
                    "emailError"
                ).textContent = "";


                document.getElementById(
                    "phoneError"
                ).textContent = "";


                document.getElementById(
                    "passwordError"
                ).textContent = "";


                document.getElementById(
                    "confirmPasswordError"
                ).textContent = "";


                document.getElementById(
                    "termsError"
                ).textContent = "";


                /* VALUES */

                const name =
                    document.getElementById(
                        "name"
                    ).value.trim();


                const email =
                    document.getElementById(
                        "email"
                    ).value.trim()
                    .toLowerCase();


                const phone =
                    document.getElementById(
                        "phone"
                    ).value.trim();


                const password =
                    document.getElementById(
                        "password"
                    ).value;


                const confirmPassword =
                    document.getElementById(
                        "confirmPassword"
                    ).value;


                const terms =
                    document.getElementById(
                        "terms"
                    ).checked;


                let valid = true;


                /* NAME VALIDATION */

                if (!name) {

                    document.getElementById(
                        "nameError"
                    ).textContent =
                        "Please enter your full name.";

                    valid = false;

                }

                else if (
                    name.length < 3
                ) {

                    document.getElementById(
                        "nameError"
                    ).textContent =
                        "Name must contain at least 3 characters.";

                    valid = false;

                }


                /* EMAIL VALIDATION */

                const emailPattern =
                    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


                if (!email) {

                    document.getElementById(
                        "emailError"
                    ).textContent =
                        "Please enter your email.";

                    valid = false;

                }

                else if (
                    !emailPattern.test(email)
                ) {

                    document.getElementById(
                        "emailError"
                    ).textContent =
                        "Please enter a valid email address.";

                    valid = false;

                }


                /* PHONE VALIDATION */

                if (!phone) {

                    document.getElementById(
                        "phoneError"
                    ).textContent =
                        "Please enter your mobile number.";

                    valid = false;

                }

                else if (
                    !/^[0-9]{10}$/.test(phone)
                ) {

                    document.getElementById(
                        "phoneError"
                    ).textContent =
                        "Mobile number must contain exactly 10 digits.";

                    valid = false;

                }


                /* PASSWORD VALIDATION */

                if (!password) {

                    document.getElementById(
                        "passwordError"
                    ).textContent =
                        "Please create a password.";

                    valid = false;

                }

                else if (
                    password.length < 6
                ) {

                    document.getElementById(
                        "passwordError"
                    ).textContent =
                        "Password must contain at least 6 characters.";

                    valid = false;

                }


                /* CONFIRM PASSWORD */

                if (!confirmPassword) {

                    document.getElementById(
                        "confirmPasswordError"
                    ).textContent =
                        "Please confirm your password.";

                    valid = false;

                }

                else if (
                    password !== confirmPassword
                ) {

                    document.getElementById(
                        "confirmPasswordError"
                    ).textContent =
                        "Passwords do not match.";

                    valid = false;

                }


                /* TERMS */

                if (!terms) {

                    document.getElementById(
                        "termsError"
                    ).textContent =
                        "Please accept the Terms & Conditions.";

                    valid = false;

                }


                /* STOP IF INVALID */

                if (!valid) {

                    return;

                }


                /* GET EXISTING USERS */

                const users =
                    JSON.parse(
                        localStorage.getItem(
                            "users"
                        )
                    ) || [];


                /* CHECK EMAIL */

                const existingUser =
                    users.find(
                        function(user) {

                            return (
                                user.email === email
                            );

                        }
                    );


                if (existingUser) {

                    document.getElementById(
                        "emailError"
                    ).textContent =
                        "This email is already registered.";

                    return;

                }


                /* CREATE USER */

                const newUser = {

                    id:
                        "USR" +
                        Date.now(),

                    name:
                        name,

                    email:
                        email,

                    phone:
                        phone,

                    password:
                        password,

                    registeredAt:
                        new Date()
                        .toLocaleString()

                };


                /* SAVE USER */

                users.push(newUser);


                localStorage.setItem(
                    "users",
                    JSON.stringify(users)
                );


                /* SUCCESS */

                alert(
                    "Registration successful! You can now login."
                );


                /* GO TO LOGIN */

                window.location.href =
                    "login.html";


            }
        );

    </script>

</body>

</html>
