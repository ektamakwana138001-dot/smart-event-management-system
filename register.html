<!-- ================= REGISTER SECTION ================= -->

<section
    class="auth-section d-flex align-items-center py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-5 col-md-7">


                <div
                    class="card border-0 shadow-lg">


                    <div class="card-body p-4 p-md-5">


                        <!-- ICON -->

                        <div class="text-center mb-4">

                            <div
                                class="auth-icon mx-auto mb-3">

                                <i class="bi bi-person-plus"></i>

                            </div>


                            <h2 class="fw-bold">

                                Create Account

                            </h2>


                            <p class="text-muted mb-0">

                                Register to book your favorite events.

                            </p>

                        </div>



                        <!-- MESSAGE -->

                        <div
                            id="registerMessage"
                            class="alert"
                            style="display:none;"
                            role="alert">

                        </div>



                        <!-- REGISTER FORM -->

                        <form id="registerForm">


                            <!-- FULL NAME -->

                            <div class="mb-3">

                                <label
                                    for="registerName"
                                    class="form-label fw-semibold">

                                    Full Name

                                </label>


                                <div class="input-group">

                                    <span
                                        class="input-group-text">

                                        <i class="bi bi-person"></i>

                                    </span>


                                    <input
                                        type="text"
                                        class="form-control"
                                        id="registerName"
                                        placeholder="Enter your full name"
                                        autocomplete="name"
                                        required>

                                </div>

                            </div>



                            <!-- EMAIL -->

                            <div class="mb-3">

                                <label
                                    for="registerEmail"
                                    class="form-label fw-semibold">

                                    Email Address

                                </label>


                                <div class="input-group">

                                    <span
                                        class="input-group-text">

                                        <i class="bi bi-envelope"></i>

                                    </span>


                                    <input
                                        type="email"
                                        class="form-control"
                                        id="registerEmail"
                                        placeholder="Enter your email"
                                        autocomplete="email"
                                        required>

                                </div>

                            </div>



                            <!-- PASSWORD -->

                            <div class="mb-3">

                                <label
                                    for="registerPassword"
                                    class="form-label fw-semibold">

                                    Password

                                </label>


                                <div class="input-group">

                                    <span
                                        class="input-group-text">

                                        <i class="bi bi-lock"></i>

                                    </span>


                                    <input
                                        type="password"
                                        class="form-control"
                                        id="registerPassword"
                                        placeholder="Minimum 6 characters"
                                        autocomplete="new-password"
                                        minlength="6"
                                        required>


                                    <button
                                        type="button"
                                        class="btn btn-outline-secondary"
                                        id="toggleRegisterPassword">

                                        <i
                                            class="bi bi-eye"
                                            id="registerPasswordIcon">
                                        </i>

                                    </button>

                                </div>

                            </div>



                            <!-- CONFIRM PASSWORD -->

                            <div class="mb-4">

                                <label
                                    for="confirmPassword"
                                    class="form-label fw-semibold">

                                    Confirm Password

                                </label>


                                <div class="input-group">

                                    <span
                                        class="input-group-text">

                                        <i class="bi bi-lock-fill"></i>

                                    </span>


                                    <input
                                        type="password"
                                        class="form-control"
                                        id="confirmPassword"
                                        placeholder="Re-enter your password"
                                        autocomplete="new-password"
                                        minlength="6"
                                        required>


                                    <button
                                        type="button"
                                        class="btn btn-outline-secondary"
                                        id="toggleConfirmPassword">

                                        <i
                                            class="bi bi-eye"
                                            id="confirmPasswordIcon">
                                        </i>

                                    </button>

                                </div>

                            </div>



                            <!-- TERMS -->

                            <div class="form-check mb-4">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="registerTerms"
                                    required>


                                <label
                                    class="form-check-label"
                                    for="registerTerms">

                                    I agree to the terms and conditions.

                                </label>

                            </div>



                            <!-- REGISTER BUTTON -->

                            <button
                                type="submit"
                                class="btn btn-primary btn-lg w-100">

                                <i class="bi bi-person-plus"></i>

                                Create Account

                            </button>


                        </form>



                        <!-- LOGIN LINK -->

                        <div class="text-center mt-4">

                            <p class="text-muted mb-0">

                                Already have an account?

                                <a
                                    href="login.html"
                                    class="text-primary fw-semibold text-decoration-none">

                                    Login Here

                                </a>

                            </p>

                        </div>


                    </div>

                </div>


            </div>

        </div>

    </div>

</section>

<!-- ================= PASSWORD TOGGLE ================= -->

<script>

    document.addEventListener(
        "DOMContentLoaded",
        function () {


            const password =
                document.getElementById(
                    "registerPassword"
                );


            const passwordButton =
                document.getElementById(
                    "toggleRegisterPassword"
                );


            const passwordIcon =
                document.getElementById(
                    "registerPasswordIcon"
                );


            if (
                password &&
                passwordButton
            ) {

                passwordButton.addEventListener(
                    "click",
                    function () {


                        if (
                            password.type ===
                            "password"
                        ) {

                            password.type =
                                "text";

                            passwordIcon.className =
                                "bi bi-eye-slash";

                        } else {

                            password.type =
                                "password";

                            passwordIcon.className =
                                "bi bi-eye";

                        }

                    }
                );

            }



            const confirmPassword =
                document.getElementById(
                    "confirmPassword"
                );


            const confirmButton =
                document.getElementById(
                    "toggleConfirmPassword"
                );


            const confirmIcon =
                document.getElementById(
                    "confirmPasswordIcon"
                );


            if (
                confirmPassword &&
                confirmButton
            ) {

                confirmButton.addEventListener(
                    "click",
                    function () {


                        if (
                            confirmPassword.type ===
                            "password"
                        ) {

                            confirmPassword.type =
                                "text";

                            confirmIcon.className =
                                "bi bi-eye-slash";

                        } else {

                            confirmPassword.type =
                                "password";

                            confirmIcon.className =
                                "bi bi-eye";

                        }

                    }
                );

            }

        }

    );

</script>
