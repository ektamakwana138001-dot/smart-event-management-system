<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Smart Events</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.65),
                    rgba(0, 0, 0, 0.65)
                ),
                url("https://images.unsplash.com/photo-1505373877841-8d25f7d46678?auto=format&fit=crop&w=1800&q=85");

            background-size: cover;

            background-position: center;

            background-attachment: fixed;
        }

        /* NAVBAR */

        .navbar {
            background: #212529 !important;
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
        }

        .navbar-brand {
            font-weight: bold;

            font-size: 21px;
        }

        /* LOGIN AREA */

        .admin-section {
            min-height: calc(100vh - 70px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 50px 15px;
        }

        .admin-card {
            width: 100%;

            max-width: 450px;

            background: rgba(255,255,255,0.97);

            border-radius: 20px;

            padding: 35px;

            box-shadow:
                0 15px 50px
                rgba(0,0,0,0.35);
        }

        .admin-icon {
            width: 80px;

            height: 80px;

            border-radius: 50%;

            background: #212529;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 36px;

            margin: 0 auto 20px;
        }

        .admin-title {
            text-align: center;

            font-size: 30px;

            font-weight: bold;
        }

        .admin-subtitle {
            text-align: center;

            color: #777;

            margin-bottom: 30px;
        }

        .form-control {
            padding: 12px;

            border-radius: 10px;
        }

        .form-control:focus {
            border-color: #212529;

            box-shadow:
                0 0 0 0.2rem
                rgba(33,37,41,0.15);
        }

        .login-btn {
            width: 100%;

            padding: 13px;

            border-radius: 10px;

            font-size: 17px;

            font-weight: bold;
        }

        .error-message {
            display: none;

            background: #f8d7da;

            color: #842029;

            border: 1px solid #f5c2c7;

            padding: 11px;

            border-radius: 9px;

            margin-bottom: 18px;

            font-size: 14px;
        }

        .success-message {
            display: none;

            background: #d1e7dd;

            color: #0f5132;

            border: 1px solid #badbcc;

            padding: 11px;

            border-radius: 9px;

            margin-bottom: 18px;

            font-size: 14px;
        }

        .back-link {
            display: block;

            text-align: center;

            margin-top: 20px;

            text-decoration: none;

            color: #0d6efd;
        }

        .demo-box {
            margin-top: 25px;

            padding: 15px;

            background: #f8f9fa;

            border-radius: 10px;

            border: 1px solid #dee2e6;

            font-size: 14px;
        }

        .demo-box strong {
            color: #212529;
        }

        /* FOOTER */

        footer {
            background: #212529;

            color: white;

            padding: 18px;

            text-align: center;
        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a
                class="navbar-brand"
                href="index.html">

                <i class="bi bi-calendar-event"></i>

                Smart Events

            </a>


            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div
                class="collapse navbar-collapse"
                id="navbarMenu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="index.html">

                            Home

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="events.html">

                            Events

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="login.html">

                            User Login

                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- ADMIN LOGIN -->

    <section class="admin-section">

        <div class="admin-card">


            <div class="admin-icon">

                <i class="bi bi-shield-lock"></i>

            </div>


            <h1 class="admin-title">

                Admin Login

            </h1>


            <p class="admin-subtitle">

                Login to manage Smart Events

            </p>


            <!-- ERROR -->

            <div
                id="errorMessage"
                class="error-message">

            </div>


            <!-- SUCCESS -->

            <div
                id="successMessage"
                class="success-message">

            </div>


            <!-- FORM -->

            <form id="adminLoginForm">


                <!-- EMAIL -->

                <div class="mb-3">

                    <label
                        class="form-label fw-bold">

                        Admin Email

                    </label>


                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-envelope"></i>

                        </span>


                        <input
                            type="email"
                            id="adminEmail"
                            class="form-control"
                            placeholder="Enter admin email"
                            required>

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="mb-4">

                    <label
                        class="form-label fw-bold">

                        Password

                    </label>


                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-lock"></i>

                        </span>


                        <input
                            type="password"
                            id="adminPassword"
                            class="form-control"
                            placeholder="Enter admin password"
                            required>

                    </div>

                </div>


                <!-- LOGIN -->

                <button
                    type="submit"
                    class="btn btn-dark login-btn">

                    <i class="bi bi-box-arrow-in-right"></i>

                    Login as Admin

                </button>


            </form>


            <!-- DEMO LOGIN -->

            <div class="demo-box">

                <strong>

                    Demo Admin Login

                </strong>

                <br><br>

                Email:
                <b>admin@smartevents.com</b>

                <br>

                Password:
                <b>admin123</b>

            </div>


            <!-- BACK -->

            <a
                href="login.html"
                class="back-link">

                <i class="bi bi-arrow-left"></i>

                Back to User Login

            </a>


        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        © 2026 Smart Event Management System.
        All Rights Reserved.

    </footer>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- ADMIN LOGIN JAVASCRIPT -->

    <script>


        const form =
            document.getElementById(
                "adminLoginForm"
            );


        const errorMessage =
            document.getElementById(
                "errorMessage"
            );


        const successMessage =
            document.getElementById(
                "successMessage"
            );


        form.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const email =
                    document.getElementById(
                        "adminEmail"
                    ).value.trim();


                const password =
                    document.getElementById(
                        "adminPassword"
                    ).value;


                errorMessage.style.display =
                    "none";

                successMessage.style.display =
                    "none";


                /* EMPTY VALIDATION */

                if (!email) {

                    showError(
                        "Please enter admin email."
                    );

                    return;

                }


                if (!password) {

                    showError(
                        "Please enter admin password."
                    );

                    return;

                }


                /* ADMIN LOGIN */

                if (
                    email ===
                    "admin@smartevents.com"
                    &&
                    password ===
                    "admin123"
                ) {


                    const adminData = {

                        email:
                            email,

                        role:
                            "admin",

                        loginTime:
                            new Date()
                                .toLocaleString()

                    };


                    localStorage.setItem(
                        "adminLoggedIn",
                        "true"
                    );


                    localStorage.setItem(
                        "adminData",
                        JSON.stringify(
                            adminData
                        )
                    );


                    successMessage.textContent =
                        "Admin login successful! Opening dashboard...";


                    successMessage.style.display =
                        "block";


                    setTimeout(
                        function() {

                            window.location.href =
                                "dashboard.html";

                        },
                        1000
                    );


                } else {


                    showError(
                        "Invalid admin email or password."
                    );

                }

            }
        );


        function showError(message) {

            errorMessage.textContent =
                message;

            errorMessage.style.display =
                "block";

            successMessage.style.display =
                "none";

        }

    </script>


</body>

</html>
