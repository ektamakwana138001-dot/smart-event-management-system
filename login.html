<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Smart Events</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    rgba(13, 110, 253, 0.75),
                    rgba(8, 66, 152, 0.75)
                ),
                url("https://images.unsplash.com/photo-1505236858219-8359eb29e329?auto=format&fit=crop&w=1800&q=85");

            background-size: cover;
            background-position: center;

            display: flex;
            flex-direction: column;
        }

        /* NAVBAR */

        .navbar {
            background: #0d6efd !important;
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 21px;
        }

        /* LOGIN AREA */

        .login-area {
            flex: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 50px 15px;
        }

        .login-card {
            width: 100%;
            max-width: 450px;

            background: white;

            border-radius: 20px;

            padding: 35px;

            box-shadow:
                0 15px 50px
                rgba(0, 0, 0, 0.25);
        }

        .login-icon {
            width: 75px;
            height: 75px;

            margin: 0 auto 20px;

            background: #e7f1ff;
            color: #0d6efd;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 35px;
        }

        .login-card h2 {
            text-align: center;
            font-weight: bold;
        }

        .login-card .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-control {
            padding: 13px;
            border-radius: 10px;
        }

        .input-group-text {
            background: #f8f9fa;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            font-weight: bold;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            text-decoration: none;
            font-weight: bold;
        }

        /* ADMIN */

        .admin-login {
            text-align: center;
            margin-top: 20px;
        }

        .admin-login button {
            border: none;
            background: transparent;
            color: #0d6efd;
            font-weight: bold;
        }

        /* ERROR */

        #loginError {
            display: none;
        }

        /* FOOTER */

        footer {
            background: #212529;
            color: white;
            text-align: center;
            padding: 18px;
        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a
                class="navbar-brand"
                href="index.html">

                <i class="bi bi-calendar-event"></i>

                Smart Events

            </a>


            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div
                class="collapse navbar-collapse"
                id="navbarMenu">

                <ul class="navbar-nav ms-auto">


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="index.html">

                            Home

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="events.html">

                            Events

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="register.html">

                            Register

                        </a>

                    </li>


                </ul>

            </div>

        </div>

    </nav>


    <!-- LOGIN -->

    <section class="login-area">

        <div class="login-card">


            <div class="login-icon">

                <i class="bi bi-person"></i>

            </div>


            <h2>

                Welcome Back

            </h2>


            <p class="subtitle">

                Login to your Smart Events account

            </p>


            <!-- ERROR -->

            <div
                id="loginError"
                class="alert alert-danger">

                <i class="bi bi-exclamation-circle"></i>

                <span id="errorMessage"></span>

            </div>


            <!-- LOGIN FORM -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="mb-3">

                    <label
                        class="form-label">

                        Email Address

                    </label>


                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-envelope"></i>

                        </span>


                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            placeholder="Enter your email"
                            required>

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="mb-3">

                    <label
                        class="form-label">

                        Password

                    </label>


                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-lock"></i>

                        </span>


                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder="Enter your password"
                            required>


                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            onclick="togglePassword()">

                            <i
                                id="passwordIcon"
                                class="bi bi-eye">
                            </i>

                        </button>

                    </div>

                </div>


                <!-- REMEMBER -->

                <div class="form-check mb-4">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="rememberMe">

                    <label
                        class="form-check-label"
                        for="rememberMe">

                        Remember me

                    </label>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="btn btn-primary login-btn">

                    <i class="bi bi-box-arrow-in-right"></i>

                    Login

                </button>


            </form>


            <!-- REGISTER -->

            <div class="register-link">

                Don't have an account?

                <a href="register.html">

                    Register Now

                </a>

            </div>


            <!-- ADMIN LOGIN -->

            <div class="admin-login">

                <button
                    type="button"
                    onclick="adminLogin()">

                    <i class="bi bi-shield-lock"></i>

                    Admin Login

                </button>

            </div>


        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        © 2026 Smart Event Management System.
        All Rights Reserved.

    </footer>


    <!-- BOOTSTRAP JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- LOGIN JAVASCRIPT -->

    <script>


        /* SHOW ERROR */

        function showError(message) {

            document.getElementById(
                "errorMessage"
            ).textContent = message;


            document.getElementById(
                "loginError"
            ).style.display = "block";

        }


        /* HIDE ERROR */

        function hideError() {

            document.getElementById(
                "loginError"
            ).style.display = "none";

        }


        /* PASSWORD SHOW/HIDE */

        function togglePassword() {

            const password =
                document.getElementById(
                    "password"
                );


            const icon =
                document.getElementById(
                    "passwordIcon"
                );


            if (
                password.type === "password"
            ) {

                password.type = "text";

                icon.className =
                    "bi bi-eye-slash";

            } else {

                password.type = "password";

                icon.className =
                    "bi bi-eye";

            }

        }


        /* USER LOGIN */

        document.getElementById(
            "loginForm"
        ).addEventListener(
            "submit",
            function(event) {


                event.preventDefault();

                hideError();


                const email =
                    document.getElementById(
                        "email"
                    ).value.trim();


                const password =
                    document.getElementById(
                        "password"
                    ).value;


                /* VALIDATION */

                if (!email) {

                    showError(
                        "Please enter your email address."
                    );

                    return;

                }


                if (!password) {

                    showError(
                        "Please enter your password."
                    );

                    return;

                }


                /* GET USERS */

                const users =
                    JSON.parse(
                        localStorage.getItem(
                            "users"
                        )
                    ) || [];


                /* FIND USER */

                const user =
                    users.find(
                        function(item) {

                            return (
                                item.email === email &&
                                item.password === password
                            );

                        }
                    );


                if (!user) {

                    showError(
                        "Invalid email or password. Please register first."
                    );

                    return;

                }


                /* SAVE LOGIN */

                localStorage.setItem(
                    "currentUser",
                    JSON.stringify(user)
                );


                /* REMEMBER ME */

                if (
                    document.getElementById(
                        "rememberMe"
                    ).checked
                ) {

                    localStorage.setItem(
                        "rememberMe",
                        "true"
                    );

                }


                /* SUCCESS */

                alert(
                    "Login successful! Welcome " +
                    user.name
                );


                window.location.href =
                    "index.html";


            }
        );


        /* ADMIN LOGIN */

        function adminLogin() {


            const adminEmail =
                prompt(
                    "Enter Admin Email:"
                );


            if (!adminEmail) {

                return;

            }


            const adminPassword =
                prompt(
                    "Enter Admin Password:"
                );


            if (!adminPassword) {

                return;

            }


            /*
             DEMO ADMIN LOGIN

             Email:
             admin@smartevents.com

             Password:
             admin123
            */

            if (
                adminEmail ===
                    "admin@smartevents.com"
                &&
                adminPassword ===
                    "admin123"
            ) {


                localStorage.setItem(
                    "adminLoggedIn",
                    "true"
                );


                alert(
                    "Admin Login Successful!"
                );


                window.location.href =
                    "dashboard.html";


            } else {


                alert(
                    "Invalid Admin Email or Password."
                );

            }

        }

    </script>

</body>

</html>
