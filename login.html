<body>

```

<!-- ================= LOGIN SECTION ================= -->

<section
    class="auth-section d-flex align-items-center py-5">

    <div class="container">


        <div
            class="row justify-content-center">

            <div
                class="col-lg-5 col-md-7">


                <div
                    class="card border-0 shadow-lg">


                    <div
                        class="card-body p-4 p-md-5">


                        <!-- ICON -->

                        <div
                            class="text-center mb-4">


                            <div
                                class="auth-icon mx-auto mb-3">

                                <i
                                    class="bi bi-box-arrow-in-right">
                                </i>

                            </div>


                            <h2
                                class="fw-bold">

                                Welcome Back

                            </h2>


                            <p
                                class="text-muted mb-0">

                                Login to manage your event bookings.

                            </p>

                        </div>



                        <!-- LOGIN MESSAGE -->

                        <div
                            id="loginMessage"
                            class="alert"
                            style="display:none;"
                            role="alert">

                        </div>



                        <!-- LOGIN FORM -->

                        <form
                            id="loginForm">


                            <!-- EMAIL -->

                            <div
                                class="mb-3">


                                <label
                                    for="loginEmail"
                                    class="form-label fw-semibold">

                                    Email Address

                                </label>


                                <div
                                    class="input-group">


                                    <span
                                        class="input-group-text">

                                        <i
                                            class="bi bi-envelope">
                                        </i>

                                    </span>


                                    <input
                                        type="email"
                                        class="form-control"
                                        id="loginEmail"
                                        placeholder="Enter your email"
                                        autocomplete="email"
                                        required>

                                </div>

                            </div>



                            <!-- PASSWORD -->

                            <div
                                class="mb-4">


                                <label
                                    for="loginPassword"
                                    class="form-label fw-semibold">

                                    Password

                                </label>


                                <div
                                    class="input-group">


                                    <span
                                        class="input-group-text">

                                        <i
                                            class="bi bi-lock">
                                        </i>

                                    </span>


                                    <input
                                        type="password"
                                        class="form-control"
                                        id="loginPassword"
                                        placeholder="Enter your password"
                                        autocomplete="current-password"
                                        required>


                                    <button
                                        type="button"
                                        class="btn btn-outline-secondary"
                                        id="toggleLoginPassword">

                                        <i
                                            class="bi bi-eye"
                                            id="loginPasswordIcon">
                                        </i>

                                    </button>

                                </div>

                            </div>



                            <!-- REMEMBER -->

                            <div
                                class="form-check mb-4">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="rememberLogin">


                                <label
                                    class="form-check-label"
                                    for="rememberLogin">

                                    Remember me

                                </label>

                            </div>



                            <!-- LOGIN BUTTON -->

                            <button
                                type="submit"
                                class="btn btn-primary btn-lg w-100">

                                <i
                                    class="bi bi-box-arrow-in-right">
                                </i>

                                Login

                            </button>


                        </form>



                        <!-- REGISTER LINK -->

                        <div
                            class="text-center mt-4">

                            <p
                                class="text-muted mb-0">

                                Don't have an account?

                                <a
                                    href="register.html"
                                    class="text-primary fw-semibold text-decoration-none">

                                    Create Account

                                </a>

                            </p>

                        </div>


                    </div>

                </div>


            </div>

        </div>

    </div>

</section>



<!-- ================= FOOTER ================= -->

    class="bg-dark text-white py-4">

    <div
        class="container">

        <div

            <p

                    class="bi bi-calendar-event">
                </i>

                Smart Events

            </p>


            <p

            </p>


            <small
                class="text-white-50">

                © 2026 Smart Events. All Rights Reserved.

            </small>

        </div>

    </div>

</footer>



<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>



<!-- Main JavaScript -->

<script
    src="script.js">
</script>



<!-- Password Toggle -->

<script>

    document.addEventListener(
        "DOMContentLoaded",
        function () {


            const password =
                document.getElementById(
                    "loginPassword"
                );


            const button =
                document.getElementById(
                    "toggleLoginPassword"
                );


            const icon =
                document.getElementById(
                    "loginPasswordIcon"
                );


            if (
                password &&
                button &&
                icon
            ) {


                button.addEventListener(
                    "click",
                    function () {


                        if (
                            password.type ===
                            "password"
                        ) {

                            password.type =
                                "text";

                            icon.className =
                                "bi bi-eye-slash";

                        } else {

                            password.type =
                                "password";

                            icon.className =
                                "bi bi-eye";

                        }

                    }
                );

            }

        }

    );

</script>
```

</body>
