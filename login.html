<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Smart Events</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <style>

        .login-section {
            min-height: calc(100vh - 76px);
            display: flex;
            align-items: center;
            padding: 60px 15px;
            background:
                linear-gradient(
                    rgba(7, 24, 46, 0.85),
                    rgba(13, 110, 253, 0.75)
                ),
                url("https://images.unsplash.com/photo-1505236858219-8359eb29e329?auto=format&fit=crop&w=1600&q=80")
                center/cover;
        }

        .login-card {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.20);
        }

        .login-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #eaf2ff;
            color: #0d6efd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
        }

        .login-card h2 {
            font-weight: 800;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control {
            min-height: 50px;
        }

        .error-message {
            display: none;
            color: #dc3545;
            font-size: 13px;
            margin-top: 5px;
        }

        .success-message {
            display: none;
            background: #d1e7dd;
            color: #0f5132;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .password-box {
            position: relative;
        }

        .password-box button {
            position: absolute;
            right: 10px;
            top: 8px;
            border: none;
            background: transparent;
            font-size: 20px;
            color: #666;
        }

        .login-links {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 20px;
        }

        @media (max-width: 576px) {

            .login-card {
                padding: 25px;
            }

            .login-links {
                flex-direction: column;
                text-align: center;
            }

        }

    </style>
</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">

    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">

            <i class="bi bi-calendar-event"></i>
            Smart Events

        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div
            class="collapse navbar-collapse"
            id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="events.html">
                        Events
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="booking.html">
                        Book Ticket
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="my-bookings.html">
                        My Bookings
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contact.html">
                        Contact
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="login.html">
                        Login
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- LOGIN -->

<section class="login-section">

    <div class="container">

        <div class="login-card">

            <div class="text-center">

                <div class="login-icon">

                    <i class="bi bi-person"></i>

                </div>

                <h2>
                    Welcome Back
                </h2>

                <p class="text-muted">
                    Login to manage your event bookings.
                </p>

            </div>


            <div
                id="successMessage"
                class="success-message">

                <i class="bi bi-check-circle-fill"></i>

                Login successful!

            </div>


            <form id="loginForm" novalidate>


                <!-- EMAIL -->

                <div class="mb-3">

                    <label
                        for="email"
                        class="form-label">

                        Email Address

                        <span class="text-danger">*</span>

                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Enter your email">

                    <div
                        id="emailError"
                        class="error-message">

                        Please enter a valid email address.

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="mb-3">

                    <label
                        for="password"
                        class="form-label">

                        Password

                        <span class="text-danger">*</span>

                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder="Enter your password">

                        <button
                            type="button"
                            id="togglePassword">

                            <i class="bi bi-eye"></i>

                        </button>

                    </div>

                    <div
                        id="passwordError"
                        class="error-message">

                        Password must contain at least 6 characters.

                    </div>

                </div>


                <!-- REMEMBER -->

                <div class="form-check mb-4">

                    <input
                        type="checkbox"
                        class="form-check-input"
                        id="rememberMe">

                    <label
                        class="form-check-label"
                        for="rememberMe">

                        Remember me

                    </label>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="btn btn-primary btn-lg w-100">

                    <i class="bi bi-box-arrow-in-right"></i>

                    Login

                </button>


                <div class="login-links">

                    <a href="register.html">
                        Create New Account
                    </a>

                    <a href="index.html">
                        Back to Home
                    </a>

                </div>

            </form>

        </div>

    </div>

</section>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="js/login.js"></script>

</body>
</html>
