<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Smart Events</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <style>

        body {
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #0d6efd !important;
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
        }

        .dashboard {
            padding: 60px 0;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
            height: 100%;
        }

        .stat-icon {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            background: #e7f1ff;
            color: #0d6efd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            margin-bottom: 15px;
        }

        .stat-number {
            font-size: 30px;
            font-weight: bold;
        }

        .action-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
        }

        footer {
            background: #212529;
            color: white;
            text-align: center;
            padding: 30px;
            margin-top: 60px;
        }

    </style>

</head>


<body>


<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a
            class="navbar-brand"
            href="./index.html">

            <i class="bi bi-calendar-event"></i>

            Smart Events

        </a>


        <div>

            <a
                href="./index.html"
                class="btn btn-light btn-sm">

                Website

            </a>

        </div>

    </div>

</nav>


<section class="dashboard">

    <div class="container">

        <h1 class="fw-bold mb-2">
            Admin Dashboard
        </h1>

        <p class="text-muted mb-5">
            Manage your Smart Event Management System.
        </p>


        <!-- STATISTICS -->

        <div class="row g-4 mb-5">


            <div class="col-md-4">

                <div class="stat-card">

                    <div class="stat-icon">

                        <i class="bi bi-calendar-event"></i>

                    </div>

                    <div class="stat-number">
                        6
                    </div>

                    <div>
                        Total Events
                    </div>

                </div>

            </div>


            <div class="col-md-4">

                <div class="stat-card">

                    <div class="stat-icon">

                        <i class="bi bi-ticket-perforated"></i>

                    </div>

                    <div class="stat-number">
                        0
                    </div>

                    <div>
                        Total Bookings
                    </div>

                </div>

            </div>


            <div class="col-md-4">

                <div class="stat-card">

                    <div class="stat-icon">

                        <i class="bi bi-people"></i>

                    </div>

                    <div class="stat-number">
                        0
                    </div>

                    <div>
                        Registered Users
                    </div>

                </div>

            </div>

        </div>


        <!-- ACTIONS -->

        <div class="action-card">

            <h3 class="fw-bold mb-4">
                Event Management
            </h3>


            <div class="row g-3">


                <div class="col-md-4">

                    <a
                        href="./events.html"
                        class="btn btn-primary w-100 py-3">

                        <i class="bi bi-calendar-event"></i>

                        View All Events

                    </a>

                </div>


                <div class="col-md-4">

                    <a
                        href="./events.html"
                        class="btn btn-success w-100 py-3">

                        <i class="bi bi-plus-circle"></i>

                        Manage Events

                    </a>

                </div>


                <div class="col-md-4">

                    <a
                        href="./my-bookings.html"
                        class="btn btn-warning w-100 py-3">

                        <i class="bi bi-ticket"></i>

                        View Bookings

                    </a>

                </div>


            </div>


            <hr class="my-4">


            <h3 class="fw-bold mb-4">
                Website
            </h3>


            <div class="row g-3">


                <div class="col-md-4">

                    <a
                        href="./index.html"
                        class="btn btn-outline-primary w-100 py-3">

                        <i class="bi bi-house"></i>

                        Home

                    </a>

                </div>


                <div class="col-md-4">

                    <a
                        href="./contact.html"
                        class="btn btn-outline-primary w-100 py-3">

                        <i class="bi bi-envelope"></i>

                        Contact

                    </a>

                </div>


                <div class="col-md-4">

                    <a
                        href="./login.html"
                        class="btn btn-outline-primary w-100 py-3">

                        <i class="bi bi-box-arrow-in-right"></i>

                        Login

                    </a>

                </div>

            </div>

        </div>

    </div>

</section>


<footer>

    © 2026 Smart Event Management
    & Ticket Booking System.

</footer>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
