<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Event Details - Smart Events</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <style>

        body {
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #0d6efd !important;
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
        }

        .details-section {
            padding: 70px 0;
        }

        .details-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 5px 25px rgba(0,0,0,.1);
        }

        .event-main-image {
            width: 100%;
            height: 450px;
            object-fit: cover;
        }

        .details-content {
            padding: 35px;
        }

        .details-content h1 {
            font-weight: bold;
        }

        .info-box {
            background: #f5f7fb;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
        }

        .price {
            color: #198754;
            font-size: 30px;
            font-weight: bold;
        }

        footer {
            background: #212529;
            color: white;
            text-align: center;
            padding: 30px;
        }

    </style>

</head>

<body>


<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a
            class="navbar-brand"
            href="./index.html">

            <i class="bi bi-calendar-event"></i>
            Smart Events

        </a>


        <div>

            <a
                href="./index.html"
                class="btn btn-light btn-sm">

                Home

            </a>

            <a
                href="./events.html"
                class="btn btn-light btn-sm">

                All Events

            </a>

        </div>

    </div>

</nav>


<section class="details-section">

    <div class="container">

        <div class="details-card">

            <div class="row g-0">


                <div class="col-lg-6">

                    <img
                        id="eventImage"
                        src=""
                        alt="Event"
                        class="event-main-image">

                </div>


                <div class="col-lg-6">

                    <div class="details-content">

                        <span
                            class="badge bg-warning text-dark"
                            id="eventStatus">

                            Coming Soon

                        </span>


                        <h1
                            id="eventName"
                            class="mt-3">

                            Event

                        </h1>


                        <p
                            id="eventDescription"
                            class="text-muted">

                        </p>


                        <div class="info-box">

                            <i class="bi bi-tag"></i>

                            <strong>
                                Category:
                            </strong>

                            <span id="eventCategory"></span>

                        </div>


                        <div class="info-box">

                            <i class="bi bi-calendar3"></i>

                            <strong>
                                Date:
                            </strong>

                            <span id="eventDate"></span>

                        </div>


                        <div class="info-box">

                            <i class="bi bi-clock"></i>

                            <strong>
                                Time:
                            </strong>

                            <span id="eventTime"></span>

                        </div>


                        <div class="info-box">

                            <i class="bi bi-geo-alt"></i>

                            <strong>
                                Location:
                            </strong>

                            <span id="eventLocation"></span>

                        </div>


                        <div class="mt-3">

                            <span>
                                Ticket Price
                            </span>

                            <div
                                id="eventPrice"
                                class="price">

                            </div>

                        </div>


                        <div class="mt-4">

                            <a
                                href="./booking.html"
                                class="btn btn-success btn-lg">

                                <i class="bi bi-ticket-perforated"></i>

                                Book Ticket

                            </a>


                            <a
                                href="./events.html"
                                class="btn btn-outline-primary btn-lg">

                                Back to Events

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>


<footer>

    © 2026 Smart Event Management
    & Ticket Booking System.

</footer>


<script>

const events = {

    music: {

        name: "Music Festival",

        category: "Entertainment",

        date: "Coming Soon",

        time: "Coming Soon",

        location: "Ahmedabad",

        price: "₹499",

        image:
        "https://images.unsplash.com/photo-1501386761578-eac5c94b800a?auto=format&fit=crop&w=1200&q=85",

        description:
        "Experience live music, amazing performances and unforgettable entertainment."

    },


    technology: {

        name: "Technology Conference",

        category: "Technology",

        date: "Coming Soon",

        time: "Coming Soon",

        location: "Ahmedabad",

        price: "₹799",

        image:
        "https://images.unsplash.com/photo-1540575467063-178a50c2df87?auto=format&fit=crop&w=1200&q=85",

        description:
        "Explore artificial intelligence, innovation, software and future technology."

    },


    business: {

        name: "Business Summit",

        category: "Business",

        date: "Coming Soon",

        time: "Coming Soon",

        location: "Ahmedabad",

        price: "₹999",

        image:
        "https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=1200&q=85",

        description:
        "Connect with entrepreneurs, professionals and industry leaders."

    },


    startup: {

        name: "Startup Meetup",

        category: "Business",

        date: "Coming Soon",

        time: "Coming Soon",

        location: "Rajkot",

        price: "₹599",

        image:
        "https://images.unsplash.com/photo-1551836022-d5d88e9218df?auto=format&fit=crop&w=1200&q=85",

        description:
        "Meet startup founders, entrepreneurs and investors."

    },


    coding: {

        name: "Coding Workshop",

        category: "Technology",

        date: "Coming Soon",

        time: "Coming Soon",

        location: "Rajkot",

        price: "₹399",

        image:
        "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1200&q=85",

        description:
        "Improve your programming skills with practical coding sessions."

    },


    food: {

        name: "Food Festival",

        category: "Food",

        date: "Coming Soon",

        time: "Coming Soon",

        location: "Ahmedabad",

        price: "₹299",

        image:
        "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=1200&q=85",

        description:
        "Taste delicious food from different cuisines."

    }

};


const params =
    new URLSearchParams(
        window.location.search
    );


const eventId =
    params.get("event") || "music";


const event =
    events[eventId] || events.music;


document.getElementById(
    "eventImage"
).src = event.image;


document.getElementById(
    "eventName"
).textContent = event.name;


document.getElementById(
    "eventCategory"
).textContent = event.category;


document.getElementById(
    "eventDate"
).textContent = event.date;


document.getElementById(
    "eventTime"
).textContent = event.time;


document.getElementById(
    "eventLocation"
).textContent = event.location;


document.getElementById(
    "eventPrice"
).textContent = event.price;


document.getElementById(
    "eventDescription"
).textContent =
    event.description;

</script>


</body>
</html>
